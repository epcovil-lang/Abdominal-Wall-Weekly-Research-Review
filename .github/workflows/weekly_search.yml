name: Weekly PubMed Search for Hernia Research

on:
  schedule:
    # Runs every Tuesday at midnight UTC
    - cron: '0 0 * * 2'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  search-and-email:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run weekly PubMed search
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python pubmed_search.py
      
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: weekly-search-results
          path: latest_search_results.json
          retention-days: 30
      
      - name: Send email notification
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          python -c "
          import json
          from email_sender import ResearchEmailSender
          
          # Load search results
          with open('latest_search_results.json', 'r') as f:
              articles = json.load(f)
          
          # Send email
          sender = ResearchEmailSender()
          sender.set_credentials('${{ secrets.SENDER_EMAIL }}', '${{ secrets.SENDER_PASSWORD }}')
          recipients = '${{ secrets.RECIPIENT_EMAILS }}'.split(',')
          sender.send_email(recipients, f'Weekly Hernia Research Review - {len(articles)} Articles', articles)
          "
      
      - name: Report workflow status
        if: always()
        run: |
          echo "Weekly search completed at $(date)"
